<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>

       //   Original Array 
      let fruits = ["Apple", "Banana", "Grapes"];
      console.log("Original Array :" + fruits);

      //  Add a fruit to the end of the array
      fruits.push("Orange");
      console.log("Add fruit to the end of Array :" + fruits);

      //  Remove the first fruit from the array

      fruits.shift("Apple");
      console.log("Remove the first fruit from the array : " + fruits);

      // Modified array
      console.log("Modified Array is : " + fruits);
    </script>
  </body>
</html>
